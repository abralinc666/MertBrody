<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>LovelyTG Manager</title><style>
:root{color-scheme:dark;--bg:#0a0618;--side:#0e0820;--card:#140d2b;--line:#2a1f4d;--tx:#f1ecff;--mut:#9a8fc2;--pri:#8b4dff;--pri2:#6d2ff0;--ok:#19d38a;--warn:#ffb020;--bad:#ff4d6d;--blue:#2f8cff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(60% 50% at 70% 10%,#3a1a8a55,transparent),var(--bg)}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.logo small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.heart{width:34px;height:34px;color:var(--pri)}
.box h2{margin:22px 0 4px;font-size:22px}
.box p{margin:0 0 16px;color:var(--mut)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
input{width:100%;padding:12px 14px;border-radius:10px;background:#0c0720;border:1px solid var(--line)}
input:focus{border-color:var(--pri);outline:none}
.btn{display:block;width:100%;margin-top:18px;padding:12px;border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--pri2));font-weight:600}
.ghost{background:none;border:1px solid var(--line);margin-top:10px;color:var(--mut)}
#err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
/* app */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
aside .logo{padding:4px 8px 18px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:10px;color:var(--mut);text-align:left}
.nav:hover{background:#ffffff0a;color:var(--tx)}
.nav.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.nav i{width:18px;text-align:center;font-style:normal}
.nav b{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.plan{margin-top:auto;padding:14px;border-radius:14px;background:#1b1140;border:1px solid var(--line)}
.plan small{color:var(--mut)}
.me{display:flex;align-items:center;gap:10px;padding:12px;margin-top:10px;border-radius:14px;border:1px solid var(--line)}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--blue));display:grid;place-items:center;font-weight:700}
.me small{color:var(--ok);display:block}
main{min-width:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:14px 22px;background:#0a0618e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#menu{display:none;font-size:22px}
.search{flex:1;max-width:460px}
.search input{background:#140d2b}
.sys{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.wrap{padding:22px;max-width:1400px}
.hello{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.hello h1{margin:0;font-size:24px}
.hello p{margin:2px 0 0;color:var(--mut)}
.okbox{display:flex;gap:12px;align-items:center;padding:12px 16px;border:1px solid #1c7f6a;border-radius:14px;background:#0b1f26}
.okbox small{display:block;color:var(--mut);font-size:12px}
.chk{width:34px;height:34px;border-radius:50%;background:#12493f;color:var(--ok);display:grid;place-items:center}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.st{border-radius:14px;padding:16px;border:1px solid var(--line);display:flex;gap:12px;align-items:center}
.st .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#ffffff18}
.st small{color:#ffffffb3}
.st strong{display:block;font-size:26px;line-height:1.1}
.st em{font-style:normal;font-size:12px;color:var(--ok);margin-left:4px}
.c1{background:linear-gradient(135deg,#10265a,#0f1a3d)}.c2{background:linear-gradient(135deg,#2b1666,#1a0f3f)}
.c3{background:linear-gradient(135deg,#0d3a3a,#0a2230)}.c4{background:linear-gradient(135deg,#5a3410,#2d1c10)}.c5{background:linear-gradient(135deg,#5a1a3d,#2d1030)}
.row{display:grid;gap:14px;margin-top:14px}
.r2{grid-template-columns:1.6fr 1fr}.r3{grid-template-columns:1.1fr 1.1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ch h3{margin:0;font-size:16px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:6px 12px;color:var(--mut);font-size:13px}
.seg .on{background:var(--pri);color:#fff}
.lg{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--mut);margin-bottom:6px}
.lg span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}
svg{width:100%;height:auto;display:block}
.ev{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff0d}
.ev:last-child{border:0}
.ev .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:15px}
.ev div{flex:1;min-width:0}.ev small{display:block;color:var(--mut);font-size:12px}
.ev time{font-size:12px;color:var(--mut);white-space:nowrap}
.acc{display:grid;grid-template-columns:34px 1fr 90px 44px;gap:10px;align-items:center;padding:8px 0}
.acc .ic{width:34px;height:34px;border-radius:50%;background:var(--blue);display:grid;place-items:center}
.acc small{display:block;color:var(--mut);font-size:12px}
.bar{height:6px;border-radius:9px;background:var(--ok)}
.donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut svg{width:130px;flex:none}
.legend div{display:flex;align-items:center;gap:10px;padding:5px 0}
.legend b{margin-left:auto;padding-left:24px}
.legend i{width:11px;height:11px;border-radius:50%}
.sum{display:flex;justify-content:space-between;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.sum small{color:var(--mut);display:block}.sum strong{font-size:22px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa button{padding:14px 6px;border-radius:12px;border:1px solid var(--line);font-size:12px;display:grid;gap:6px;justify-items:center}
.qa button:hover{border-color:var(--pri)}.qa span{font-size:20px}
.soon{text-align:center;padding:70px 20px;color:var(--mut)}
.soon h2{color:var(--tx);margin:0 0 6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b1140;border:1px solid var(--pri);padding:10px 18px;border-radius:12px;z-index:20}
@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}.r2,.r3{grid-template-columns:1fr}}
@media(max-width:820px){
#app{grid-template-columns:1fr}
aside{position:fixed;z-index:30;left:0;top:0;width:260px;transform:translateX(-100%);transition:transform .2s}
aside.open{transform:none}
#menu{display:block}.sys span{display:none}.wrap{padding:14px}.stats{grid-template-columns:1fr 1fr}.st{flex-direction:column;align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){aside{transition:none}}

#rf{font-size:18px;color:var(--mut)}.ph{color:var(--mut);font-size:13px}.btn:disabled{opacity:.6}.ttl{font-weight:700}
</style></head><body>
<section id="login">
 <form class="box" onsubmit="return false">
  <div class="logo"><svg class="heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.800-8 11-8 11z"/></svg><div>LovelyTG<small>Manager v3.0</small></div></div>
  <h2>Telegram hesabınla giriş yap</h2>
  <p id="lp">Telefon numaranı ülke koduyla yaz. Kod Telegram uygulamana gelir.</p>
  <div id="s0"><label for="be">Backend adresi</label><input id="be" type="url" value="http://127.0.0.1:5000" autocomplete="off"><label for="ak">Erişim anahtarı</label><input id="ak" type="password" autocomplete="off"><button class="btn" id="b0">Bağlan</button></div>
  <div id="s1" class="hide"><label for="ph">Telefon numarası</label><input id="ph" type="tel" placeholder="+90 5xx xxx xx xx" autocomplete="tel"><button class="btn" id="b1">Kodu gönder</button></div>
  <div id="s2" class="hide"><label for="cd">Doğrulama kodu</label><input id="cd" inputmode="numeric" autocomplete="one-time-code"><button class="btn" id="b2">Giriş yap</button></div>
  <div id="s3" class="hide"><label for="pw">İki adımlı doğrulama şifresi</label><input id="pw" type="password" autocomplete="current-password"><button class="btn" id="b3">Giriş yap</button></div>
  <div id="err" role="alert"></div><button type="button" id="cfg" class="ph" style="margin-top:12px;text-decoration:underline">Bağlantı ayarları</button>
 </form>
</section>
<div id="app" class="hide">
 <aside id="side">
  <div class="logo"><svg class="heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.800-8 11-8 11z"/></svg><div>LovelyTG<small>Manager v3.0</small></div></div>
  <nav id="nav"></nav>
  <div class="me" style="margin-top:auto"><div class="av" id="av">T</div><div style="min-width:0"><b id="who">Telegram</b><small>Bağlı</small></div><button id="out" style="margin-left:auto;color:var(--mut)" aria-label="Çıkış yap" title="Çıkış yap">⎋</button></div>
 </aside>
 <main>
  <header><button id="menu" aria-label="Menü">☰</button><b id="pt">Ana Panel</b><div class="sys"><button id="rf" aria-label="Yenile" title="Yenile">↻</button><span>Telegram bağlı</span><i class="dot"></i></div></header>
  <div class="wrap" id="view"></div>
 </main>
</div>
<script>
var $=function(s){return document.querySelector(s)};
var MENU=[["home","⌂","Ana Panel"],["groups","👥","Gruplar"],["msg","✉","Mesajlar"],["aut","⚙","Otomasyon"],["rep","▥","Raporlar"],["set","☰","Ayarlar"]];
var D=null,cur="home";
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":String(n)}
function ago(iso){if(!iso)return"";var m=Math.max(0,Math.round((Date.now()-new Date(iso))/6e4));return m<60?m+" dk önce":m<1440?Math.round(m/60)+" sa önce":Math.round(m/1440)+" gün önce"}
var CFG=null;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function api(p,o){var h={"X-Access-Key":CFG.key};if(o)h["Content-Type"]="application/json";
 return fetch(CFG.base+p,{method:o?"POST":"GET",headers:h,body:o?JSON.stringify(o):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok){var x=new Error(j.error||"Hata");x.status=r.status;throw x}return j})},function(){throw new Error("Backend’e ulaşılamıyor. Termux’ta çalıştığından ve adresin doğru olduğundan emin ol.")})}
function show(id){["s0","s1","s2","s3"].forEach(function(k){$("#"+k).classList.toggle("hide",k!==id)})}
function err(m){$("#err").textContent=m||""}
function wire(id,label,fn){$(id).onclick=function(){var b=this;err();b.disabled=true;b.textContent="Bekleniyor...";fn().catch(function(e){err(e.message)}).then(function(){b.disabled=false;b.textContent=label})}}
wire("#b1","Kodu gönder",function(){return api("/api/login/send",{phone:$("#ph").value}).then(function(){show("s2");$("#lp").textContent="Kod Telegram uygulamana gönderildi.";$("#cd").focus()})});
wire("#b2","Giriş yap",function(){return api("/api/login/verify",{code:$("#cd").value}).then(function(r){if(r.need_password){show("s3");$("#lp").textContent="Hesabında iki adımlı doğrulama açık."}else enter()})});
wire("#b3","Giriş yap",function(){return api("/api/login/verify",{password:$("#pw").value}).then(enter)});
$("#out").onclick=function(){api("/api/logout",{}).then(function(){location.reload()})};
$("#menu").onclick=function(){$("#side").classList.toggle("open")};
$("#rf").onclick=function(){load(true)};
function enter(){$("#login").classList.add("hide");$("#app").classList.remove("hide");load()}
function load(refresh){
 $("#view").innerHTML='<div class="card soon"><h2>Veriler alınıyor</h2><p>Telegram hesabındaki sohbetler okunuyor. Birkaç saniye sürebilir.</p></div>';
 api("/api/dashboard"+(refresh?"?refresh=1":"")).then(function(d){D=d;$("#who").textContent=d.me.name;$("#av").textContent=d.me.name.charAt(0).toUpperCase();draw()}).catch(function(e){
  if(e.status===401||e.status===403){location.reload();return}
  $("#view").innerHTML='<div class="card soon"><h2>Veriler alınamadı</h2><p>'+esc(e.message)+'</p></div>'})}
function nav(){
 $("#nav").innerHTML=MENU.map(function(m){return '<button class="nav'+(m[0]===cur?' on':'')+'" data-v="'+m[0]+'"><i>'+m[1]+'</i>'+m[2]+'</button>'}).join("");
 Array.prototype.forEach.call(document.querySelectorAll("[data-v]"),function(b){b.onclick=function(){cur=b.getAttribute("data-v");$("#side").classList.remove("open");draw()}})}
function chart(){
 var W=640,H=260,L=44,B=34,T=10,R=14,n=7,mx=Math.max(4,Math.max.apply(null,D.sent.concat(D.recv)));mx=Math.ceil(mx/4)*4;
 var px=function(i){return L+i*(W-L-R)/(n-1)},py=function(v){return T+(H-T-B)*(1-v/mx)};
 var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Son 7 gün mesaj grafiği">';
 [0,1,2,3,4].forEach(function(k){var v=mx*k/4;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+py(v)+'" y2="'+py(v)+'" stroke="#2a1f4d"/><text x="'+(L-8)+'" y="'+(py(v)+4)+'" fill="#9a8fc2" font-size="11" text-anchor="end">'+v+'</text>'});
 D.labels.forEach(function(t,i){s+='<text x="'+px(i)+'" y="'+(H-10)+'" fill="#9a8fc2" font-size="11" text-anchor="middle">'+t+'</text>'});
 [[D.sent,"#2f8cff"],[D.recv,"#8b4dff"]].forEach(function(p){
  var pts=p[0].map(function(v,i){return px(i)+","+py(v)}),line="M"+pts.join(" L");
  s+='<path d="'+line+' L'+px(n-1)+","+py(0)+" L"+px(0)+","+py(0)+'Z" fill="'+p[1]+'" opacity=".13"/><path d="'+line+'" fill="none" stroke="'+p[1]+'" stroke-width="2.5" stroke-linejoin="round"/>';
  p[0].forEach(function(v,i){s+='<circle cx="'+px(i)+'" cy="'+py(v)+'" r="3.5" fill="'+p[1]+'"/>'})});
 return s+'</svg>'}
function home(){
 var t=D.totals,sum=D.sent.reduce(function(a,b){return a+b},0),tot=Math.max(1,t.groups+t.channels+t.users);
 var parts=[[t.groups,"#19d38a","Grup"],[t.channels,"#ffb020","Kanal"],[t.users,"#2f8cff","Kişi / bot"]],off=0;
 var arcs=parts.map(function(p){var l=p[0]/tot*100,a='<circle cx="21" cy="21" r="15.9" fill="none" stroke="'+p[1]+'" stroke-width="6" stroke-dasharray="'+l+' '+(100-l)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 21 21)"/>';off+=l;return a}).join("");
 var top=D.groups.slice(0,5),mx=Math.max(1,top.length?top[0].members:1);
 return '<div class="hello"><div><h1>Hoş geldin, '+esc(D.me.name)+'!</h1><p>Bu veriler Telegram hesabından canlı olarak okundu.</p></div></div>'+
 '<div class="stats">'+[["c1","💬","Toplam sohbet",fmt(t.chats)],["c2","👥","Grup",fmt(t.groups)],["c3","📣","Kanal",fmt(t.channels)],["c4","✉","Okunmamış",fmt(t.unread)],["c5","➤","7 günde gönderilen",fmt(sum)]].map(function(s){return '<div class="st '+s[0]+'"><div class="ic">'+s[1]+'</div><div><small>'+s[2]+'</small><strong>'+s[3]+'</strong></div></div>'}).join("")+'</div>'+
 '<div class="row r2"><div class="card"><div class="ch"><h3>Mesaj etkinliği (7 gün)</h3></div><div class="lg"><span style="--c:#2f8cff">Gönderilen</span><span style="--c:#8b4dff">Alınan</span></div>'+chart()+'<p class="ph">Son 12 aktif sohbet esas alınır.</p></div>'+
 '<div class="card"><div class="ch"><h3>Son etkinlikler</h3></div>'+D.recent.map(function(e){return '<div class="ev"><div class="ic" style="background:'+(e.out?'#12315f':'#33186b')+';color:'+(e.out?'var(--blue)':'var(--pri)')+'">'+(e.out?'➤':'✉')+'</div><div><b>'+esc(e.title)+'</b><small>'+esc(e.text)+'</small></div><time>'+ago(e.date)+'</time></div>'}).join("")+'</div></div>'+
 '<div class="row r3"><div class="card"><div class="ch"><h3>En büyük gruplar</h3></div>'+(top.length?top.map(function(g){return '<div class="acc"><div class="ic">👥</div><div style="min-width:0"><b>'+esc(g.name)+'</b><small>'+fmt(g.members)+' üye</small></div><div class="bar" style="width:'+Math.max(6,g.members/mx*100)+'%"></div><span>'+(g.unread||"")+'</span></div>'}).join(""):'<p class="ph">Henüz grubun yok.</p>')+'</div>'+
 '<div class="card"><div class="ch"><h3>Sohbet dağılımı</h3></div><div class="donut"><svg viewBox="0 0 42 42" role="img" aria-label="'+tot+' sohbet">'+arcs+'<text x="21" y="23" text-anchor="middle" fill="#f1ecff" font-size="8" font-weight="700">'+tot+'</text></svg><div class="legend" style="flex:1">'+parts.map(function(p){return '<div><i style="background:'+p[1]+'"></i>'+p[2]+'<b>'+p[0]+'</b></div>'}).join("")+'</div></div><div class="sum"><div><small>Gruplardaki üye</small><strong>'+fmt(t.members)+'</strong></div></div></div>'+
 '<div class="card"><div class="ch"><h3>Hesabım</h3></div><div class="ev"><div class="av">'+esc(D.me.name.charAt(0).toUpperCase())+'</div><div><b>'+esc(D.me.name)+'</b><small>'+(D.me.username?'@'+esc(D.me.username):'Kullanıcı adı yok')+'</small></div></div><p class="ph">Telefon: '+esc(D.me.phone||"-")+'</p></div></div>'}
function groupsView(){return '<div class="card"><div class="ch"><h3>Gruplarım ('+D.groups.length+')</h3></div>'+(D.groups.length?D.groups.map(function(g){return '<div class="ev"><div class="ic" style="background:#12493f;color:var(--ok)">👥</div><div><b>'+esc(g.name)+'</b><small>'+fmt(g.members)+' üye</small></div><time>'+(g.unread?g.unread+' okunmamış':'')+'</time></div>'}).join(""):'<p class="ph">Henüz grubun yok.</p>')+'</div>'}
function draw(){
 nav();var m=MENU.filter(function(x){return x[0]===cur})[0];$("#pt").textContent=m[2];
 $("#view").innerHTML=cur==="home"?home():cur==="groups"?groupsView():'<div class="card soon"><h2>'+m[2]+'</h2><p>Bu bölüm bir sonraki adımda eklenecek.</p></div>'}
wire("#b0","Bağlan",function(){var b=$("#be").value.trim().replace(/\/+$/,""),k=$("#ak").value.trim();if(!/^https?:\/\//.test(b)||!k)return Promise.reject(new Error("Adresi ve erişim anahtarını yaz."));CFG={base:b,key:k};return api("/api/status").then(function(s){store("ltg_base",b);store("ltg_key",k);if(s.authorized)enter();else{show("s1");$("#lp").textContent="Telefon numaranı ülke koduyla yaz. Kod Telegram uygulamana gelir."}})});
$("#cfg").onclick=function(){err();show("s0");$("#lp").textContent="Backend’in adresini ve erişim anahtarını gir."};
var sb=store("ltg_base"),sk=store("ltg_key");
if(sb&&sk){CFG={base:sb,key:sk};api("/api/status").then(function(s){if(s.authorized)enter();else show("s1")}).catch(function(e){show("s0");$("#be").value=sb;err(e.message)})}
else{show("s0");$("#lp").textContent="Backend’in adresini ve erişim anahtarını gir."}
</script>
</body></html>

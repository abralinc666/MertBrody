<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BöcekAdam • Canlı Sohbet (Demo)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- ===== 3D SAHNE ===== -->
  <section id="stage">
    <canvas id="scene"></canvas>

    <!-- Canlı yayın üst bilgileri -->
    <div class="hud hud-top-left">
      <div class="profile-pill">
        <div class="avatar">🪲</div>
        <div class="profile-text">
          <div class="name">BöcekAdam <span class="verified">✔</span></div>
          <div class="likes"><span id="likeCount">412.7K</span> beğeni</div>
        </div>
        <button class="follow-btn" id="followBtn">+ Takip Et</button>
      </div>
      <div class="rank-pill">🔥 Saatlik Sıralama No. 1</div>
    </div>

    <div class="hud hud-top-right">
      <div class="live-badge"><span class="dot"></span> CANLI</div>
      <div class="viewer-pill">👤 <span id="viewerCount">24.8K</span></div>
    </div>

    <!-- Karakterin konuşma balonu -->
    <div id="speechBubble" class="speech-bubble hidden"></div>

    <!-- Uçan kalpler -->
    <div id="hearts"></div>
    <button id="heartBtn" class="heart-btn" title="Kalp gönder">❤</button>

    <!-- Yükleme ekranı -->
    <div id="loader">
      <div class="loader-inner">
        <div class="loader-bug">🪲</div>
        <div class="loader-title">BöcekAdam yayına hazırlanıyor…</div>
        <div class="progress"><div id="progressBar"></div></div>
        <div id="progressText">%0</div>
        <div id="loaderError" class="loader-error hidden"></div>
      </div>
    </div>
  </section>

  <!-- ===== SOHBET ===== -->
  <section id="chat">
    <div class="chat-header">
      <div class="chat-title">💬 BöcekAdam ile Sohbet Et</div>
      <div class="chat-actions">
        <button id="voiceBtn" class="icon-btn" title="Sesi aç/kapat">🔊</button>
      </div>
    </div>

    <div id="messages" class="messages" aria-live="polite"></div>

    <div class="quick-replies" id="quickReplies">
      <button data-q="Selam kral!">👋 Selam</button>
      <button data-q="Kaç yaşındasın?">🎂 Kaç yaşındasın?</button>
      <button data-q="Bize bir dans göster!">🕺 Dans et</button>
      <button data-q="Bir fıkra anlat">😂 Fıkra</button>
      <button data-q="Sana gül gönderdim 🌹">🌹 Gül gönder</button>
    </div>

    <form id="chatForm" class="chat-form" autocomplete="off">
      <input id="chatInput" type="text" placeholder="Yorum ekleyin…" maxlength="200" />
      <button type="submit" class="send-btn">Gönder ➤</button>
    </form>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
